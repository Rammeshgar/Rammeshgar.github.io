<main><h1>Peoples Clinic QA evidence workflow</h1><p>Complete static teaching overview. No live data or background activity.</p><div class="diagram-container"><svg class="flow-diagram" viewBox="0 0 312 488" role="img" aria-labelledby="qa-flow-title qa-flow-desc"><title id="qa-flow-title">Peoples Clinic QA evidence workflow</title><desc id="qa-flow-desc">Selected checks run on a schedule and leave artifacts and execution history for a person to review.</desc><defs><marker id="qa-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#53635d"/></marker></defs><g class="diagram-arrow" marker-end="url(#qa-arrow)"><path d="M156 104V136"/><path d="M156 200V232"/><path d="M156 296V328"/></g><g class="flow-node" data-flow-node="coverage"><rect class="node-box" x="40" y="40" width="232" height="64" rx="6"/><text class="node-name" x="156" y="68" text-anchor="middle">Select a check</text><text class="node-sub" x="156" y="85" text-anchor="middle">Browser / API / AI / parser</text></g><g class="flow-node" data-flow-node="run"><rect class="node-box" x="40" y="136" width="232" height="64" rx="6"/><text class="node-name" x="156" y="164" text-anchor="middle">Run on a schedule</text><text class="node-sub" x="156" y="181" text-anchor="middle">GitHub Actions</text></g><g class="flow-node node-focal" data-flow-node="evidence"><rect class="node-box" x="40" y="232" width="232" height="64" rx="6"/><text class="node-name" x="156" y="260" text-anchor="middle">Keep the evidence</text><text class="node-sub" x="156" y="277" text-anchor="middle">Artifacts / execution history</text></g><g class="flow-node" data-flow-node="review"><rect class="node-box" x="40" y="328" width="232" height="64" rx="20"/><text class="node-name" x="156" y="356" text-anchor="middle">Human review</text><text class="node-sub" x="156" y="373" text-anchor="middle">Investigate selected behaviour</text></g><line x1="40" y1="428" x2="272" y2="428" stroke="#c0c7bd"/><text class="node-sub" x="40" y="452">Sequence overview, not a live result</text></svg></div><p>The full case study explains each step and the limits of this overview.</p><a href="./#workflow">Back to the case study →</a></main></html>
