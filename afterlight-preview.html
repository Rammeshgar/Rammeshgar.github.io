<!doctype html>
<html lang="en" data-preview-state="loading" data-preview-frame="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Afterlight / Canal City scene preview</title>
  <style>
    @font-face{font-family:PreviewMono;src:url("assets/jetbrains-mono-latin.woff2") format("woff2");font-weight:100 800;font-display:swap}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#16212b}
    .scene{position:relative;width:100%;height:100%;margin:0;isolation:isolate}
    .scene img,.scene canvas{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    .scene canvas{visibility:hidden}
    html[data-preview-rendered="true"] .scene canvas{visibility:visible}
    html[data-preview-rendered="true"] .scene img{visibility:hidden}
    .scene figcaption{position:absolute;z-index:1;top:10px;left:10px;max-width:calc(100% - 20px);border:1px solid #e6c5a18c;background:#17262aeb;color:#f7eddb;padding:7px 9px;font:550 10px/1.35 PreviewMono,monospace;letter-spacing:.055em;text-transform:uppercase;pointer-events:none}
    .scene figcaption span{color:#efb58e}
    @media(max-width:330px){.scene figcaption{top:6px;left:6px;padding:5px 7px;font-size:9px}}
  </style>
  <script type="module" src="afterlight-preview.mjs"></script>
</head>
<body>
  <figure class="scene" aria-labelledby="caption">
    <img src="assets/afterlight-canal.webp" alt="Canal City at night, with illuminated buildings and reflected lights on the water.">
    <canvas width="960" height="540" aria-hidden="true"></canvas>
    <figcaption id="caption"><span>Canal City</span> / Cinema scene preview</figcaption>
  </figure>
</body>
</html>
